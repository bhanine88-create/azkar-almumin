    <script>
      // Intercept and mock Vite HMR WebSocket to prevent console connection errors in the sandboxed preview
      (function() {
        const OriginalWebSocket = window.WebSocket;
        if (OriginalWebSocket) {
          const ProxyWebSocket = function(url, protocols) {
            if (typeof url === 'string' && (url.includes('vite') || url.includes('hmr') || protocols === 'vite-hmr')) {
              const mockWS = {
                url: url,
                readyState: 3, // CLOSED
                close: function() {},
                send: function() {},
                addEventListener: function() {},
                removeEventListener: function() {},
              };
              ['onopen', 'onmessage', 'onerror', 'onclose'].forEach(prop => {
                Object.defineProperty(mockWS, prop, {
                  get() { return this['_' + prop]; },
                  set(fn) { this['_' + prop] = fn; }
                });
              });
              return mockWS;
            }
            return new OriginalWebSocket(url, protocols);
          };
          ProxyWebSocket.prototype = OriginalWebSocket.prototype;
          window.WebSocket = ProxyWebSocket;
        }
      })();
    </script>
    <script>
      // Safe localStorage & sessionStorage fallback for browsers that block third-party storage or inside secure frames/private tabs
      (function() {
        let isStorageSupported = false;
        try {
          const testKey = '__test_storage__';
          window.localStorage.setItem(testKey, testKey);
          window.localStorage.removeItem(testKey);
          isStorageSupported = true;
        } catch (e) {
          isStorageSupported = false;
        }

        if (!isStorageSupported) {
          console.warn('Web Storage is blocked or throwing. Injecting absolute safe in-memory virtual storage.');
          const storage = {};
          const mock = {
            getItem: function(key) { return storage.hasOwnProperty(key) ? storage[key] : null; },
            setItem: function(key, value) { storage[key] = String(value); },
            removeItem: function(key) { delete storage[key]; },
            clear: function() { for (const k in storage) { delete storage[k]; } },
            key: function(idx) { return Object.keys(storage)[idx] || null; },
            get length() { return Object.keys(storage).length; }
          };
          
          // Patch Window.prototype
          try {
            Object.defineProperty(Window.prototype, 'localStorage', {
              get: function() { return mock; },
              configurable: true
            });
            Object.defineProperty(Window.prototype, 'sessionStorage', {
              get: function() { return mock; },
              configurable: true
            });
          } catch (errProto) {
            console.warn('Failed to define storage mock on Window.prototype:', errProto);
          }
          
          // Patch window instance
          try {
            Object.defineProperty(window, 'localStorage', { value: mock, configurable: true, writable: true });
            Object.defineProperty(window, 'sessionStorage', { value: mock, configurable: true, writable: true });
          } catch (e2) {
            console.warn('Failed to redefine storage mock on window:', e2);
          }
        }
      })();
    </script>

    <script>
      (function() {
        try {
          var settingsStr = localStorage.getItem('believer_settings_v20') || localStorage.getItem('believer_settings_v6');
          var isDark = false;
          if (settingsStr) {
            var settings = JSON.parse(settingsStr);
            if (settings.theme === 'dark') {
              isDark = true;
            } else if (settings.theme === 'system') {
              isDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
            }
          } else {
            // default is light
          }
          if (isDark) {
            document.documentElement.classList.add('dark');
            document.documentElement.style.backgroundColor = '#0f172a'; // match bg-slate-900
            document.body.style.backgroundColor = '#0f172a';
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.style.backgroundColor = '#ffffff'; // match bg-white
            document.body.style.backgroundColor = '#ffffff';
          }
        } catch(e) {}
      })();
    </script>

    <script>
      // Fallback Recovery: If React fails to mount after 4 seconds (e.g. chunk load error from old SW),
      // unregister the service worker and force a reload.
      setTimeout(function() {
        var root = document.getElementById('root');
        if (root && root.innerHTML.trim() === '') {
          if (!sessionStorage.getItem('fallback_sw_reload')) {
            sessionStorage.setItem('fallback_sw_reload', 'true');
            if ('serviceWorker' in navigator) {
              navigator.serviceWorker.getRegistrations().then(function(registrations) {
                for(var i=0; i<registrations.length; i++) {
                  registrations[i].unregister();
                }
                window.location.reload();
              });
            } else {
              window.location.reload();
            }
          } else {
            // Second failure, show a manual recovery UI instead of white screen
            root.innerHTML = '<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100dvh;font-family:sans-serif;text-align:center;padding:20px;background:#052418;color:white;" dir="rtl"><h2>عذراً، حدث خطأ أثناء التحديث</h2><p style="opacity:0.8;margin:10px 0 20px;">يرجى مسح بيانات المتصفح والتخزين المؤقت، والمحاولة مرة أخرى.</p><button onclick="localStorage.clear();sessionStorage.clear();window.location.reload();" style="padding:15px 30px;font-size:16px;background:#0f766e;color:white;border:none;border-radius:12px;cursor:pointer;">إصلاح المشكلة الآن</button></div>';
          }
        }
      }, 4000);
    </script>
