    <script>
      // Intercept and mock Vite HMR WebSocket to prevent console connection errors in the sandboxed preview
      (function() {
        const OriginalWebSocket = window.WebSocket;
        if (OriginalWebSocket) {
          const ProxyWebSocket = function(url, protocols) {
            if (typeof url === 'string' && (url.includes('vite') || url.includes('hmr') || protocols === 'vite-hmr')) {
              const mockWS = {
                url: url,
                readyState: 3, // CLOSED
                close: function() {},
                send: function() {},
                addEventListener: function() {},
                removeEventListener: function() {},
              };
              ['onopen', 'onmessage', 'onerror', 'onclose'].forEach(prop => {
                Object.defineProperty(mockWS, prop, {
                  get() { return this['_' + prop]; },
                  set(fn) { this['_' + prop] = fn; }
                });
              });
              return mockWS;
            }
            return new OriginalWebSocket(url, protocols);
          };
          ProxyWebSocket.prototype = OriginalWebSocket.prototype;
          window.WebSocket = ProxyWebSocket;
        }
      })();
    </script>
    <script>
      // Safe localStorage & sessionStorage fallback for browsers that block third-party storage or inside secure frames/private tabs
      (function() {
        let isStorageSupported = false;
        try {
          const testKey = '__test_storage__';
          window.localStorage.setItem(testKey, testKey);
          window.localStorage.removeItem(testKey);
          isStorageSupported = true;
        } catch (e) {
          isStorageSupported = false;
        }

        if (!isStorageSupported) {
          console.warn('Web Storage is blocked or throwing. Injecting absolute safe in-memory virtual storage.');
          const storage = {};
          const mock = {
            getItem: function(key) { return storage.hasOwnProperty(key) ? storage[key] : null; },
            setItem: function(key, value) { storage[key] = String(value); },
            removeItem: function(key) { delete storage[key]; },
            clear: function() { for (const k in storage) { delete storage[k]; } },
            key: function(idx) { return Object.keys(storage)[idx] || null; },
            get length() { return Object.keys(storage).length; }
          };
          
          // Patch Window.prototype
          try {
            Object.defineProperty(Window.prototype, 'localStorage', {
              get: function() { return mock; },
              configurable: true
            });
            Object.defineProperty(Window.prototype, 'sessionStorage', {
              get: function() { return mock; },
              configurable: true
            });
          } catch (errProto) {
            console.warn('Failed to define storage mock on Window.prototype:', errProto);
          }
          
          // Patch window instance
          try {
            Object.defineProperty(window, 'localStorage', { value: mock, configurable: true, writable: true });
            Object.defineProperty(window, 'sessionStorage', { value: mock, configurable: true, writable: true });
          } catch (e2) {
            console.warn('Failed to redefine storage mock on window:', e2);
          }
        }
      })();
    </script>

      // Register SW for offline caching & performance (only in production)
      if ('serviceWorker' in navigator) {
        var isDevEnv = window.location.hostname === 'localhost' || 
                       window.location.hostname === '127.0.0.1' || 
                       window.location.hostname.indexOf('ais-dev-') !== -1 ||
                       window.location.port === '3000' ||
                       window.location.port === '5173';
        if (isDevEnv) {
          navigator.serviceWorker.getRegistrations().then(function(registrations) {
            for (var i = 0; i < registrations.length; i++) {
              registrations[i].unregister();
            }
          });
        } else {
          window.addEventListener('load', function() {
            navigator.serviceWorker.register('/sw.js').then(function(reg) {
              console.log('PWA: SW registered successfully', reg.scope);
            }).catch(function(err) {
              console.warn('PWA: SW registration failed:', err);
            });
          });
        }
      }

    <script>
      (function() {
        try {
          var settingsStr = localStorage.getItem('believer_settings_v20') || localStorage.getItem('believer_settings_v6');
          var isDark = false;
          if (settingsStr) {
            var settings = JSON.parse(settingsStr);
            if (settings.theme === 'dark') {
              isDark = true;
            } else if (settings.theme === 'system') {
              isDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
            }
          } else {
            // default is light
          }
          if (isDark) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch(e) {}
      })();
    </script>

    <!--
      Boot splash styling.

      Inline, and above the module script, so it is painted by the very first
      HTML parse. A stylesheet link would not do: the brand screen has to be on
      screen before anything is fetched, or the gap it exists to cover reopens.
    -->
    <style>
      #boot-splash {
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        background: #052418;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 30px;
        opacity: 1;
        transition: opacity 140ms ease-out;
      }
      #boot-splash.is-hiding { opacity: 0; }
      #boot-recovery {
        position: absolute;
        inset-inline: 24px;
        bottom: max(32px, env(safe-area-inset-bottom));
        color: white;
        font: 16px/1.7 system-ui, sans-serif;
        text-align: center;
      }
      #boot-recovery[hidden] { display: none; }
      #boot-retry {
        margin-top: 12px;
        padding: 12px 24px;
        border: 0;
        border-radius: 12px;
        background: #f6b00f;
        color: #052418;
        font: inherit;
        cursor: pointer;
      }
      #boot-splash img {
        width: min(216px, calc(100vw - 48px));
        height: auto;
        display: block;
      }
      #boot-splash-bar {
        width: min(40vw, 150px);
        height: 3px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.14);
        overflow: hidden;
      }
      #boot-splash-bar > i {
        display: block;
        width: 40%;
        height: 100%;
        border-radius: inherit;
        background: #F6B00F;
        animation: boot-splash-sweep 1.15s ease-in-out infinite;
      }
      @keyframes boot-splash-sweep {
        from { transform: translateX(300%); }
        to   { transform: translateX(-120%); }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot-splash { transition: none; }
        #boot-splash-bar > i { animation: none; width: 100%; opacity: 0.45; }
      }
    </style>

      <div id="boot-splash-bar"><i></i></div>
      <div id="boot-recovery" role="status" hidden>
        <p>استغرق فتح التطبيق وقتاً أطول من المعتاد. يمكنك الانتظار أو إعادة المحاولة.</p>
        <button id="boot-retry" type="button">إعادة المحاولة</button>
      </div>
    </div>

    <div id="root"></div>

    <script>
      // This controller also runs when the main JS bundle fails to load.
      // A slow first install must never trigger a reload loop or erase data.
      (function() {
        var splash = document.getElementById('boot-splash');
        var watchdog = setTimeout(function() {
          // The page can finish mounting while requestAnimationFrame is paused
          // in the background. Release an already rendered route instead of
          // showing a misleading retry prompt on the next foreground.
          var root = document.getElementById('root');
          var content = root && (root.querySelector('main') || root);
          if (content && content.innerText && content.innerText.trim()) {
            window.dispatchEvent(new Event('appReady'));
            return;
          }
          document.getElementById('boot-recovery').hidden = false;
        }, 15000);

        document.getElementById('boot-retry').addEventListener('click', function() {
          window.location.reload();
        });

        window.addEventListener('appReady', function() {
          clearTimeout(watchdog);
          document.documentElement.removeAttribute('data-booting');
          splash.classList.add('is-hiding');
          function removeSplash() { splash.remove(); }
          splash.addEventListener('transitionend', removeSplash, { once: true });
          // Reduced motion and background tabs may not emit transitionend.
          setTimeout(removeSplash, 240);
        }, { once: true });
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      document.addEventListener('gesturestart', function (e) {
        e.preventDefault();
      });
      document.addEventListener('touchstart', function(event) {
        if (event.touches.length > 1) {
          event.preventDefault();
        }
      }, { passive: false });
    </script>
