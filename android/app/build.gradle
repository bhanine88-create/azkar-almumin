apply plugin: 'com.android.application'

/**
 * Release signing credentials.
 *
 * Read from android/keystore.properties, which is git-ignored and never leaves
 * the machine. If the file (or the .jks it points at) is missing, the release
 * signing config is simply not created and `assembleRelease` falls back to the
 * debug key — that keeps the project buildable for anyone without the keystore,
 * instead of failing with a confusing Gradle error. An unsigned-for-release
 * build is obvious in the logs and cannot be uploaded to Play by accident.
 */
def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
def hasReleaseKeystore = false

if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
    def storeFilePath = keystoreProperties['storeFile']
    if (storeFilePath && rootProject.file(storeFilePath).exists()
            && keystoreProperties['storePassword'] && keystoreProperties['keyAlias']) {
        hasReleaseKeystore = true
    } else {
        logger.warn("keystore.properties found but incomplete — release builds will use the debug key.")
    }
} else {
    logger.warn("android/keystore.properties not found — release builds will use the debug key.")
}

android {
    namespace = "com.azkaralmumin.app"
    compileSdk = rootProject.ext.compileSdkVersion

    defaultConfig {
        applicationId "com.azkar.almumin"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion

        // Bump versionCode for EVERY upload to Play — Google rejects a reused
        // one, and it can never be lowered again.
        versionCode 2
        versionName "1.0.1"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        // Arabic is the app's primary language and all of its own strings live
        // in the JS bundle, so no resource locale filtering is applied here.
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }

    signingConfigs {
        if (hasReleaseKeystore) {
            release {
                storeFile rootProject.file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                // Many keystores use one password for both; fall back to it.
                keyPassword keystoreProperties['keyPassword'] ?: keystoreProperties['storePassword']

                // Sign with both schemes: v1 for API 24-ish devices, v2 for the
                // rest. Play re-signs the upload anyway, but a directly
                // installed APK has to verify on every supported device.
                enableV1Signing true
                enableV2Signing true
            }
        }
    }

    buildTypes {
        release {
            // The app's own logic is JavaScript, so R8 only has the thin native
            // shell and the Capacitor plugins to work on. Shrinking is still
            // worth it for the AndroidX dependencies it pulls in, and resource
            // shrinking drops the launcher/splash densities a device cannot use.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'

            if (hasReleaseKeystore) {
                signingConfig signingConfigs.release
            }

            // Never ship a debuggable WebView: it would let anyone with adb
            // inspect the app's storage, including the Firebase session.
            debuggable false
        }

        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
            minifyEnabled false
            shrinkResources false
        }
    }

    bundle {
        // Keep every language's resources in each delivered APK. The Play
        // language split would otherwise install only the device's locale, and a
        // user reading Arabic on an English-locale phone must still get the
        // Arabic resources.
        language {
            enableSplit = false
        }
        density {
            enableSplit = true
        }
        abi {
            enableSplit = true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    lint {
        // A lint warning must not block a release build.
        abortOnError false
        checkReleaseBuilds false
    }

    packagingOptions {
        resources {
            excludes += ['META-INF/LICENSE*', 'META-INF/NOTICE*', 'META-INF/*.kotlin_module']
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
